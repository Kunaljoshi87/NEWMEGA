media:
  input: media/blog
  output: /NEWMEGA/media/blog
  rename: safe
  categories: [image]
content:
  - name: posts
    label: Blog articles
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: published
        label: Publish on website
        type: boolean
      - name: date
        label: Article date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: author
        label: Author
        type: string
      - name: category
        label: Category
        type: select
        options:
          values: [Ethanol & Distillery, CO2 Recovery, Biogas & CBG, Industrial Equipment, Engineering Insights, Sustainability]
      - name: description
        label: SEO description (120-160 characters)
        type: text
        required: true
      - name: cover
        label: Featured image
        type: image
      - name: body
        label: Article content
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
