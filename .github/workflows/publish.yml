name: Build and publish MEGA website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install blog generator dependencies
        run: pip install mistune PyYAML beautifulsoup4
      - name: Generate static blog and sitemap
        run: python scripts/build_blog.py
      - name: Title Case for headings and buttons
        run: python scripts/titlecase.py
      - name: Build language versions (ES, FR, PT, RU)
        run: python scripts/build_i18n.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
